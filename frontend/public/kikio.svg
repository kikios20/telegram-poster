<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kikioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14">
        <animate attributeName="stop-color" values="#39ff14;#00ff88;#39ff14" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#39ff14;#00ff88" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring with glow -->
  <circle cx="20" cy="20" r="18" stroke="url(#kikioGradient)" stroke-width="2" fill="none" filter="url(#glow)">
    <animate attributeName="r" values="18;17;18" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- K letters stylized -->
  <path d="M12 12 L12 28 M12 20 L20 12 M12 20 L20 28" 
        stroke="url(#kikioGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)">
  </path>
  
  <path d="M20 12 L20 28 M20 20 L28 12 M20 20 L28 28" 
        stroke="url(#kikioGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"
        filter="url(#glow)">
  </path>
  
  <!-- Center dot -->
  <circle cx="20" cy="20" r="2" fill="#39ff14" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
