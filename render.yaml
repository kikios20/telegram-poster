# Render.com Blueprint
services:
  - type: web
    name: telegram-poster-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./telegram_poster.db
      - key: PYTHON_VERSION
        value: "3.11"
