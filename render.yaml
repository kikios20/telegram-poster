# Render.com Blueprint
databases:
  - name: telegram-poster-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: telegram-poster-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-poster-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
    onDeploy:
      - name: db-init
        command: python scripts/migrate.py init
